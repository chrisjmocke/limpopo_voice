name: limpopo_voice
description: "A multi-language translation app for Limpopo, South Africa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core requirements
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  # AI and Environment
  google_generative_ai: ^0.4.0
  flutter_dotenv: ^5.1.0
  # Multimedia and Sharing
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # IMPORTANT: You must register the .env file as an asset
  assets:
    - .env