name: limpopo_voice
description: Limpopo Voice Translation App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase (LOCKED COMPATIBLE)
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_functions: ^4.7.6
  cloud_firestore: ^4.17.5

  # 🔥 Google Play Billing
  in_app_purchase: ^3.1.11

  # 🔥 Audio Engine (ENTERPRISE LOCKED)
  flutter_sound: ^9.28.0
  audio_session: ^0.1.16

  # 🔥 Text To Speech
  flutter_tts: ^3.8.5

  # 🔥 Permissions
  permission_handler: ^11.3.1
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
