name: limpopo_voice
description: "Authentic Limpopo Translation App"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core Features
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  vibration: ^3.1.8
  # Backend & AI
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  firebase_app_check: ^0.4.1+1
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  flutter_dotenv: ^6.0.0
  http: ^1.2.0
  path_provider: ^2.1.5
  # Sharing
  share_plus: ^12.0.1
  audioplayers: ^6.1.0
  # Note: audioplayers removed to save space as we use generic TTS now.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
     - assets/lv.png
     - .env