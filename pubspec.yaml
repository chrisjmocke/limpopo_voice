name: limpopo_voice
description: "Authentic Limpopo Translation App"
publish_to: 'none'
version: 1.1.0+2003

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core Features
  speech_to_text: ^7.0.0
  vibration: ^3.1.8
  # Backend & AI
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  google_sign_in: ^6.3.0
  firebase_app_check: ^0.4.1+1
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  flutter_dotenv: ^6.0.0
  flutter_native_splash: ^2.4.4
  http: ^1.2.0
  path_provider: ^2.1.5
  # Sharing
  share_plus: ^12.0.1
  url_launcher: ^6.2.6
  permission_handler: ^12.0.0
  audioplayers: ^6.1.0
  payfast: ^1.0.2
  webview_flutter: ^4.13.1
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  device_info_plus: ^12.3.0
  # Note: audioplayers removed to save space as we use generic TTS now.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/letstalkmainblack.png

flutter:
  uses-material-design: true
  assets:
    - assets/letstalkmainblack.png
    - assets/letstalkmainwhite.png
    - assets/paystack.png
    - assets/learn_sentences.json
    - assets/audio/learn/Afrikaans/
    - assets/audio/learn/English/
    - assets/audio/learn/isiNdebele/
    - assets/audio/learn/isiXhosa/
    - assets/audio/learn/isiZulu/
    - assets/audio/learn/Sepedi/
    - assets/audio/learn/Sesotho/
    - assets/audio/learn/Setswana/
    - assets/audio/learn/siSwati/
    - assets/audio/learn/Tshivenda/
    - assets/audio/learn/Xitsonga/
    - .env