<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoLanga - Bridge the Gap</title>
    
    <meta property="og:title" content="LingoLanga Translation">
    <meta property="og:description" content="Someone sent you a message! Download LingoLanga to translate across Pan-African and English languages.">
    <meta property="og:image" content="https://letstalk.web.app/logo.png">
    <meta property="og:url" content="https://letstalk.web.app">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .logo { color: #008080; font-size: 50px; margin-bottom: 10px; }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background-color: #008080;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #006666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎙️</div>
        <h1>LingoLanga</h1>
        <p>You received a voice message! Our app helps people communicate across Pan-African and English languages seamlessly.</p>
        <p><strong>Install the app to view and hear your message.</strong></p>
        <a href="https://play.google.com/store/apps/details?id=YOUR_APP_ID" class="btn">Get it on Play Store</a>
    </div>
</body>
</html>
